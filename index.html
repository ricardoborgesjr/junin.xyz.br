<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Junin</title>
        <link rel="icon" type="image/x-icon" href="favicon.ico" />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <header>
            <style>
                html,
                body {
                    height: 100%;
                    margin: 0;
                }
                main,
                body {
                    min-height: 100vh;
                }
                main video {
                    position: fixed;
                    top: 50%;
                    left: 50%;
                    min-width: 100%;
                    min-height: 100%;
                    width: auto;
                    height: auto;
                    transform: translate(-50%, -50%);
                    z-index: -1;
                    object-fit: cover;
                    background: #000;
                }
                main::before {
                    content: "";
                    position: fixed;
                    inset: 0;
                    z-index: 0;
                    pointer-events: none;
                    background: repeating-linear-gradient(
                        to bottom,
                        rgba(0, 0, 0, 0) 1px,
                        rgba(0, 0, 0, 0) 12px,
                        rgba(0, 0, 0, 0.12) 12px,
                        rgba(0, 0, 0, 0.12) 16px
                    );
                    mix-blend-mode: overlay;
                    opacity: 0.6;
                }
                header {
                    position: relative;
                    z-index: 1;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    padding: 2rem;
                    pointer-events: none;
                }
                header h1 {
                    margin: 0;
                    color: #fff;
                    background: rgba(0, 0, 0, 0.5);
                    padding: 0.5rem 1rem;
                    border-radius: 4px;
                    pointer-events: auto;
                }

                /* === PLAY OVERLAY === */
                #play-overlay {
                    position: fixed;
                    inset: 0;
                    z-index: 10;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    background: rgba(0, 0, 0, 0.55);
                    cursor: pointer;
                    transition: opacity 0.4s ease;
                }
                #play-overlay.hidden {
                    opacity: 0;
                    pointer-events: none;
                }
                #play-btn {
                    width: 80px;
                    height: 80px;
                    border-radius: 50%;
                    background: rgba(255, 255, 255, 0.15);
                    border: 2px solid rgba(255, 255, 255, 0.8);
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    transition:
                        transform 0.15s ease,
                        background 0.15s ease;
                    backdrop-filter: blur(4px);
                }
                #play-overlay:hover #play-btn {
                    transform: scale(1.1);
                    background: rgba(255, 255, 255, 0.25);
                }
                #play-btn svg {
                    width: 32px;
                    height: 32px;
                    fill: #fff;
                    margin-left: 4px; /* óptico para centrar o triângulo */
                }
            </style>
            <div class="header-content">
                <h1>Em construção</h1>
            </div>
        </header>

        <!-- Overlay de play -->
        <div id="play-overlay" onclick="startMedia()">
            <div id="play-btn">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 5v14l11-7z" />
                </svg>
            </div>
        </div>

        <main>
            <video loop muted id="rey-chiquita">
                <source src="media/video/rei-plush.mp4" type="video/mp4" />
                Seu navegador não suporta a tag de vídeo.
            </video>
        </main>

        <footer>
            <p>Tocando: lym. - Cigana Porradeira.wav</p>
            <audio loop id="pancadao">
                <source
                    src="media/audio/lym.-CiganaPorradeira.wav"
                    type="audio/wav"
                />
                Seu navegador não suporta a tag de áudio.
            </audio>
            <p>&copy; 202x Junin. Todos os direitos reservados.</p>
        </footer>

        <script>
            function startMedia() {
                var video = document.getElementById("rey-chiquita");
                var audio = document.getElementById("pancadao");
                var overlay = document.getElementById("play-overlay");

                video.muted = false; // desmutar se quiser som do vídeo também
                video.play();
                audio.play();

                overlay.classList.add("hidden");
            }
        </script>
    </body>
</html>
